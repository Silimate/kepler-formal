# GitHub Actions workflow to run SEC dual-rail k-induction regressions.
name: regress-dual-rail-ki

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/regress-ki.yml
    with:
      sec_x_mode: dual_rail_steady
