name: coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  BUILD_TYPE: Debug

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        submodules: true

     # install dependencies
    - name: Install GoogleTest
      run: sudo apt-get update && sudo apt-get install -y libgtest-dev cmake
    - name: Checkout submodules
      run: git submodule update --init --recursive
 
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -yq \
          build-essential cmake ninja-build clang pkg-config \
          libboost-dev libfl-dev libtbb-dev capnproto libcapnp-dev \
          libgtest-dev libspdlog-dev libfmt-dev libboost-iostreams-dev zlib1g-dev lcov

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCODE_COVERAGE=ON -DLONG_TESTS=ON

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build -j 4 --config ${{env.BUILD_TYPE}}
      env:
        CC:   clang
        CXX:  clang++

    - name: Test
      working-directory: ${{github.workspace}}/build
      env:
        PYTHONMALLOC: malloc
      run: ctest --output-on-failure -C ${{ env.BUILD_TYPE }}

    - name: Run SEC unit tests
      working-directory: ${{github.workspace}}/build
      run: ctest --output-on-failure -R 'SequentialEquivalenceStrategyTests\.'

    - name: Run SEC CLI tests
      working-directory: ${{github.workspace}}/build
      run: ctest --output-on-failure -R 'KeplerFormalCliTests\.(ConfigSecIgnoresRenamedInternalState|ConfigSystemVerilogSecVerificationAccepted|ConfigSecVerificationWritesDefaultLog|ConfigSecDifferenceLogIncludesWitnessDetails|ConfigTinyRocketSecVerificationAccepted)'

    - name: Install najaeda
      run: python3 -m pip install najaeda

    - name: Generate TinyRocket CSRFile SEC example
      working-directory: ${{github.workspace}}/example
      run: python3 extract_tinyrocket_csrfile_sec.py

    - name: Run TinyRocket CSRFile SEC k3 example
      working-directory: ${{github.workspace}}/example
      run: |
        rm -f tinyrocket_csrfile_sec.log
        ../build/src/bin/kepler-formal --config test_config_verilog_tinyrocket_csrfile_sec.yaml
        grep "SEC found a counterexample at k = 3" tinyrocket_csrfile_sec.log

    - name: Run TinyRocket SEC self-check
      working-directory: ${{github.workspace}}/example
      run: |
        ../build/src/bin/kepler-formal --config test_config_verilog_tinyrocket_sec.yaml > tinyrocket_self_sec.out 2>&1
        grep "SEC proved equivalence at k = 1" tinyrocket_self_sec.out

    - name: lcov
      working-directory: ${{github.workspace}}/build
      run: |
           lcov --directory . --capture --output-file coverage.info
           lcov --remove coverage.info --output-file coverage.info '/usr/*' '*/test/*' '*/kepler-formal/thirdparty/*'

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      with:
        fail_ci_if_error: true
        disable_search: true
        files: ${{github.workspace}}/build/coverage.info
        flags: unittests
        name: codecov-umbrella
        verbose: true
