# GitHub Actions workflow to build kepler-formal and run it on the example inputs
name: regress

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    # install dependencies
    - name: Install GoogleTest
      run: sudo apt-get update && sudo apt-get install -y libgtest-dev cmake
    - name: Checkout submodules
      run: git submodule update --init --recursive
    - name: Install boost & capnproto
      run: sudo apt-get update && sudo apt-get install -y pkg-config libboost-dev libfl-dev capnproto libcapnp-dev ninja-build clang libtbb-dev libspdlog-dev libboost-iostreams-dev zlib1g-dev
      
    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -GNinja -DCMAKE_C_COMPILER=clang -DENABLE_SANITIZERS=ON -DPYTHON_INTERFACE=OFF -DCMAKE_CXX_STANDARD=20
    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      env:
        PYTHONMALLOC: malloc
      # Execute tests defined by the CMake configuration.  
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -VV -E ".*[p|P]ython.*" -C ${{env.BUILD_TYPE}}

    - name: Run SEC unit tests
      working-directory: ${{github.workspace}}/build
      run: ctest --output-on-failure -R 'SequentialEquivalenceStrategyTests\.'

    - name: Run SEC CLI tests
      working-directory: ${{github.workspace}}/build
      run: ctest --output-on-failure -R 'KeplerFormalCliTests\.(ConfigSecIgnoresRenamedInternalState|ConfigSystemVerilogSecVerificationAccepted|ConfigTinyRocketSecVerificationAccepted)'
    
    - name: Clone kepler-formal-regress
      working-directory: ${{github.workspace}}
      run: |
        git clone https://github.com/keplertech/kepler-formal-regress
    
    - name: Run cts_aes_asap7_base
      working-directory: ${{github.workspace}}
      run: |
        bash regress/run_cnf_regress.sh \
          cts_aes_asap7_base \
          "${{github.workspace}}/kepler-formal-regress/cts_aes_asap7_base" \
          "${{github.workspace}}/build/src/bin/kepler-formal" \
          objects/asap7/aes/base/4_rsz_lec_test.yml \
          expect-identical
  
    - name: Run sky130hd_gcd
      working-directory: ${{github.workspace}}
      run: |
        bash regress/run_cnf_regress.sh \
          sky130hd_gcd \
          "${{github.workspace}}/kepler-formal-regress/sky130hd_gcd" \
          "${{github.workspace}}/build/src/bin/kepler-formal" \
          objects/sky130hd/gcd/base/4_rsz_lec_test.yml \
          expect-identical
    
    - name: Run nangate45_black_parrot
      working-directory: ${{github.workspace}}
      run: |
        bash regress/run_cnf_regress.sh \
          nangate45_black_parrot \
          "${{github.workspace}}/kepler-formal-regress/nangate45_black_parrot" \
          "${{github.workspace}}/build/src/bin/kepler-formal" \
          objects/nangate45/bp/base/4_rsz_lec_test.yml \
          expect-identical
    
    - name: Run ihp-sg13g2_i2c-gpio-expander
      working-directory: ${{github.workspace}}
      run: |
        bash regress/run_cnf_regress.sh \
          ihp_sg13g2_i2c_gpio_expander \
          "${{github.workspace}}/kepler-formal-regress/ihp-sg13g2_i2c-gpio-expander" \
          "${{github.workspace}}/build/src/bin/kepler-formal" \
          objects/ihp-sg13g2/i2c-gpio-expander/base/4_rsz_lec_test.yml \
          expect-identical
  
    - name: Run on naja if
      working-directory: ${{github.workspace}}
      run: |
        bash regress/run_cnf_regress.sh \
          tinyrocket_naja_if \
          "${{github.workspace}}" \
          "${{github.workspace}}/build/src/bin/kepler-formal" \
          regress/tinyrocket_naja_if/config.yaml
    
    - name: Run on verilog
      working-directory: ${{github.workspace}}
      run: |
        bash regress/run_cnf_regress.sh \
          tinyrocket_verilog \
          "${{github.workspace}}" \
          "${{github.workspace}}/build/src/bin/kepler-formal" \
          regress/tinyrocket_verilog/config.yaml
          
    - name: Install najaeda
      run: pip install najaeda

    - name: Execute edit.py
      working-directory: ${{github.workspace}}/example
      run: python edit.py

    - name: Generate TinyRocket CSRFile SEC example
      working-directory: ${{github.workspace}}/example
      run: python extract_tinyrocket_csrfile_sec.py

    - name: Run TinyRocket CSRFile SEC k3 example
      working-directory: ${{github.workspace}}/example
      run: |
        rm -f tinyrocket_csrfile_sec.log
        ../build/src/bin/kepler-formal --config test_config_verilog_tinyrocket_csrfile_sec.yaml
        grep "SEC found a counterexample at k = 3" tinyrocket_csrfile_sec.log

    - name: Run TinyRocket CSRFile SEC strategy counterexample examples
      working-directory: ${{github.workspace}}/example
      run: |
        for engine in KINDUCTION IMC PDR; do
          out="tinyrocket_csrfile_sec_${engine}.out"
          ../build/src/bin/kepler-formal -verilog \
            -v SEC \
            -k 4 \
            --sec-engine "$engine" \
            --design1 tinyrocket_csrfile.v tinyrocket_csrfile_wrapper.v \
            --design2 tinyrocket_csrfile.v tinyrocket_csrfile_wrapper_k3.v \
            --liberty \
              NangateOpenCellLibrary_typical.lib \
              fakeram45_1024x32.lib \
              fakeram45_64x32.lib \
              fakeram45_64x15.lib \
            > "$out" 2>&1
          cat "$out"
          grep "SEC found a counterexample" "$out"
        done

    - name: Run TinyRocket SEC self-check
      working-directory: ${{github.workspace}}/example
      run: |
        ../build/src/bin/kepler-formal --config test_config_verilog_tinyrocket_sec.yaml > tinyrocket_self_sec.out 2>&1
        cat tinyrocket_self_sec.out
        grep "SEC proved equivalence at k = 1" tinyrocket_self_sec.out

    - name: Run on naja if edited
      working-directory: ${{github.workspace}}
      run: |
        bash regress/run_cnf_regress.sh \
          tinyrocket_naja_if_edited \
          "${{github.workspace}}" \
          "${{github.workspace}}/build/src/bin/kepler-formal" \
          regress/tinyrocket_naja_if_edited/config.yaml
    
    - name: Run on verilog edited
      working-directory: ${{github.workspace}}
      run: |
        bash regress/run_cnf_regress.sh \
          tinyrocket_verilog_edited \
          "${{github.workspace}}" \
          "${{github.workspace}}/build/src/bin/kepler-formal" \
          regress/tinyrocket_verilog_edited/config.yaml
