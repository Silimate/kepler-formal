name: bazel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      # No submodules needed — Bazel fetches deps via http_archive

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -yq \
          build-essential pkg-config \
          libboost-dev libtbb-dev capnproto libcapnp-dev \
          libfl-dev zlib1g-dev python3-dev

    - name: Build kepler-formal
      run: bazelisk build //src/bin:kepler-formal

    - name: Run tests
      run: bazelisk test //test/...
