# GitHub Actions workflow to run SEC dual-rail PDR regressions.
name: regress-dual-rail-pdr

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  bp-final-probe:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgtest-dev cmake pkg-config libboost-dev libfl-dev \
          capnproto libcapnp-dev ninja-build libtbb-dev libspdlog-dev \
          libboost-iostreams-dev zlib1g-dev

    - name: Checkout submodules
      run: git submodule update --init --recursive

    - name: Configure CMake
      run: |
        cmake -B ${{github.workspace}}/build-sec-regress \
          -GNinja \
          -DPYTHON_INTERFACE=OFF \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_STANDARD=20 \
          -DCMAKE_CXX_FLAGS="-O3 -march=native -ffast-math -flto -DNDEBUG" \
          -DCMAKE_CXX_FLAGS_RELEASE="-Ofast -march=native -ffast-math -flto -DNDEBUG" \
          -DCMAKE_EXE_LINKER_FLAGS="-flto"

    - name: Build
      run: cmake --build ${{github.workspace}}/build-sec-regress --target kepler-formal --config Release

    - name: Clone kepler-formal-examples
      working-directory: ${{github.workspace}}
      run: git clone https://github.com/keplertech/kepler-formal-examples

    - name: Probe BP final dual-rail PDR in isolation
      working-directory: ${{github.workspace}}/kepler-formal-examples/nangate45_black_parrot_sec_final
      run: |
        probe_config="${RUNNER_TEMP}/bp-final-dual-rail-pdr.yaml"
        awk '
          /^[[:space:]]*verification:/ { next }
          /^[[:space:]]*sec_engine:/ { next }
          /^[[:space:]]*sec_encoding:/ { next }
          /^[[:space:]]*max_k:/ { next }
          /^[[:space:]]*compact_mode:/ { next }
          /^[[:space:]]*cnf_export:/ { next }
          /^[[:space:]]*cnf_export_path:/ { next }
          /^[[:space:]]*po_cnf_export:/ { next }
          /^[[:space:]]*po_cnf_export_path:/ { next }
          /^[[:space:]]*log_file:/ { next }
          { print }
        ' 6_final_sec_test.yml > "${probe_config}"
        {
          echo
          echo "verification: sec"
          echo "sec_engine: pdr"
          echo "sec_encoding: dual_rail_steady"
          echo "max_k: 32"
          echo "compact_mode: true"
        } >> "${probe_config}"
        echo "BP final isolated probe SEC settings:"
        grep -E "^(verification|sec_engine|sec_encoding|max_k|compact_mode):" "${probe_config}"
        grep -qx "sec_encoding: dual_rail_steady" "${probe_config}"
        time_log="${RUNNER_TEMP}/bp-final-dual-rail-pdr.time"
        stdout_log="${RUNNER_TEMP}/bp-final-dual-rail-pdr.stdout"
        kepler_pid=""
        tail_pid=""
        print_probe_resources() {
          local stage="$1"
          echo "[bp-final-probe] stage=${stage}"
          free -h || true
          if [[ -n "${kepler_pid}" && -r "/proc/${kepler_pid}/status" ]]; then
            awk '/^(VmPeak|VmHWM|VmRSS|VmSwap|Threads):/ { print "[bp-final-probe] proc " $0 }' \
              "/proc/${kepler_pid}/status" || true
          fi
          for path in \
            /sys/fs/cgroup/memory.current \
            /sys/fs/cgroup/memory.peak \
            /sys/fs/cgroup/memory.max \
            /sys/fs/cgroup/memory.swap.current \
            /sys/fs/cgroup/memory.swap.peak
          do
            if [[ -r "${path}" ]]; then
              echo "[bp-final-probe] cgroup ${path##*/}=$(< "${path}")"
            fi
          done
          if [[ -r /sys/fs/cgroup/memory.events ]]; then
            sed 's/^/[bp-final-probe] cgroup memory.events /' /sys/fs/cgroup/memory.events
          fi
        }
        cancel_probe() {
          echo "[bp-final-probe] received cancellation signal"
          print_probe_resources "signal"
          if [[ -n "${kepler_pid}" ]]; then
            kill -TERM "${kepler_pid}" 2>/dev/null || true
            sleep 2
            print_probe_resources "after-term"
            kill -KILL "${kepler_pid}" 2>/dev/null || true
          fi
          if [[ -n "${tail_pid}" ]]; then
            kill "${tail_pid}" 2>/dev/null || true
          fi
          if [[ -s "${time_log}" ]]; then
            cat "${time_log}"
          else
            echo "[bp-final-probe] no /usr/bin/time output was written"
          fi
          exit 130
        }
        trap cancel_probe INT TERM
        : > "${stdout_log}"
        print_probe_resources "before"
        /usr/bin/time -v -o "${time_log}" \
          "${{github.workspace}}/build-sec-regress/src/bin/kepler-formal" \
          --config "${probe_config}" > "${stdout_log}" 2>&1 &
        kepler_pid=$!
        tail -n +1 -f "${stdout_log}" &
        tail_pid=$!
        while kill -0 "${kepler_pid}" 2>/dev/null; do
          sleep 30
          if kill -0 "${kepler_pid}" 2>/dev/null; then
            print_probe_resources "running"
          fi
        done
        kepler_status=0
        wait "${kepler_pid}" || kepler_status=$?
        sleep 1
        kill "${tail_pid}" 2>/dev/null || true
        wait "${tail_pid}" 2>/dev/null || true
        print_probe_resources "after"
        cat "${time_log}" || true
        exit "${kepler_status}"

  build:
    needs: bp-final-probe
    uses: ./.github/workflows/regress-pdr.yml
    with:
      sec_encoding: dual_rail_steady
      skip_bp_final: true
      require_full_coverage: true
